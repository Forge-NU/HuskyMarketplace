<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Husky sign-in code</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fff9ef;
      color: #171719;
      font-family: Arial, sans-serif;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden">
      Your one-time code for Husky Marketplace.
    </div>
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 440px;
              border-collapse: collapse;
              background: #ffffff;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 32px;
                    color: #c8102e;
                    font-size: 28px;
                    font-weight: 800;
                    letter-spacing: -1px;
                  "
                >
                  husky
                </p>
                <h1 style="margin: 0 0 12px; font-size: 26px; line-height: 1.2">
                  Your sign-in code.
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #626268;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  Enter this code in Husky Marketplace to continue.
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    padding: 20px 8px;
                    border-radius: 10px;
                    background: #fff4ee;
                    text-align: center;
                    font-family: monospace;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: 3px;
                    word-break: break-all;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 0;
                    color: #626268;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  Keep this code private. Didn’t request it? You can ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
          <p
            style="
              max-width: 400px;
              margin: 20px 0 0;
              color: #727071;
              font-size: 12px;
              line-height: 1.5;
            "
          >
            Husky Marketplace · An independent student project.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
