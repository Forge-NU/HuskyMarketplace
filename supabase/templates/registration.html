<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your school email</title>
  </head>
  <body
    style="
      margin: 0;
      background: #fff8ee;
      font-family: Arial, sans-serif;
      color: #171717;
      padding: 32px 16px;
    "
  >
    <table
      role="presentation"
      style="max-width: 480px; width: 100%; margin: auto"
    >
      <tr>
        <td>
          <p style="color: #d00027; font-size: 30px; font-weight: 700">
            husky*
          </p>
          <h1 style="font-size: 28px; line-height: 1.2">You’re almost in.</h1>
          <p style="font-size: 16px; line-height: 1.6">
            Enter this code in Husky Marketplace to confirm your Northeastern
            email.
          </p>
          <p
            style="
              padding: 24px;
              background: white;
              border: 1px solid #e8e2da;
              border-radius: 12px;
              font-size: 32px;
              letter-spacing: 6px;
              text-align: center;
              font-weight: bold;
            "
          >
            {{ .Token }}
          </p>
          <p style="font-size: 16px; line-height: 1.6">
            Next up: a quick campus introduction, then you’re ready to explore.
          </p>
          <p style="color: #666; font-size: 13px; line-height: 1.6">
            Didn’t create an account? You can ignore this email. Never share
            this code.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
