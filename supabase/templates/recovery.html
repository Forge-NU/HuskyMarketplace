<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      background: #fff8ee;
      color: #171717;
      font-family: Arial, sans-serif;
      padding: 32px 16px;
    "
  >
    <table
      role="presentation"
      style="max-width: 480px; width: 100%; margin: auto"
    >
      <tr>
        <td>
          <p style="color: #d00027; font-size: 30px; font-weight: bold">
            husky*
          </p>
          <h1>Let’s get you back in.</h1>
          <p>
            Enter this code on the password reset page, then choose your new
            password.
          </p>
          <p
            style="
              background: white;
              padding: 24px;
              font-size: 32px;
              letter-spacing: 6px;
              text-align: center;
            "
          >
            {{ .Token }}
          </p>
          <p>
            Didn’t request this? Ignore this email. Your password hasn’t
            changed.
          </p>
          <p style="font-size: 13px; color: #666">Never share this code.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
